name: Test Build

on:
  # Run by hand while the repository is private (a push would spend macOS minutes);
  # the push trigger comes back at release, as in the other WET repos.
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone VST3 SDK
        run: git clone --recursive https://github.com/steinbergmedia/vst3sdk.git

      - name: Build
        run: ./build.bat

      - name: Validate Windows plugin
        run: |
          echo "Running VST3 validator (47 tests)..."
          WetReducer/build/bin/Release/validator.exe WetReducer/build/VST3/Release/WetReducer.vst3

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone VST3 SDK
        run: git clone --recursive https://github.com/steinbergmedia/vst3sdk.git

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ libstdc++6 libx11-xcb-dev libxcb-util-dev \
            libxcb-cursor-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libcairo2-dev libgtkmm-3.0-dev libsqlite3-dev \
            libxcb-keysyms1-dev

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Validate Linux plugin
        run: |
          echo "Running VST3 validator (47 tests)..."
          WetReducer/build/bin/Release/validator WetReducer/build/VST3/Release/WetReducer.vst3

  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone VST3 SDK
        run: git clone --recursive https://github.com/steinbergmedia/vst3sdk.git

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify macOS code signing
        run: |
          echo "Verifying code signature..."
          if [ -d "WetReducer/build/Release/WetReducer.vst3" ]; then
            codesign -v WetReducer/build/Release/WetReducer.vst3
          elif [ -d "WetReducer/build/VST3/Release/WetReducer.vst3" ]; then
            codesign -v WetReducer/build/VST3/Release/WetReducer.vst3
          else
            echo "ERROR: Plugin not found for signing verification"
            exit 1
          fi

      - name: Validate macOS plugin
        run: |
          echo "Running VST3 validator (47 tests)..."
          # macOS Xcode builds to WetReducer/build/VST3/Release/WetReducer.vst3/
          if [ -f "WetReducer/build/bin/Release/validator" ]; then
            ./WetReducer/build/bin/Release/validator "WetReducer/build/VST3/Release/WetReducer.vst3"
          else
            echo "Validator not found, checking alternative locations..."
            find . -name "validator" -type f 2>/dev/null
            echo "Skipping validation - validator binary not located"
          fi